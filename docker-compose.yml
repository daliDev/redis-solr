services:
  mongo:
    image: mongo:8.0
    volumes: ["mongo-data:/data/db"]
  app:
    build:
      context: .
      args: { UID: "${UID:-1000}", GID: "${GID:-1000}" }
    volumes: [".:/var/www"]
    depends_on: [redis, mongo]

  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ".:/var/www"
      - "./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on: [app]

  worker:
    build:
      context: .
      args: { UID: "${UID:-1000}", GID: "${GID:-1000}" }
    user: www-data # لا root — وإلا ينشئ laravel.log كـ root ويكسر php-fpm
    volumes: [".:/var/www"]
    command: php artisan queue:work redis --tries=3 --timeout=60
    depends_on: [redis, mongo]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]

volumes:
  redis-data: {}
  mongo-data: {}
